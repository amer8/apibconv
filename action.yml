name: apibconv
description: Install and verify a published apibconv release for use in GitHub Actions
author: amer8

inputs:
  version:
    description: apibconv release tag to install, for example v0.7.0
    required: true
  asset-base-url:
    description: Optional base URL for release assets, for example file:///path/to/dist
    required: false

outputs:
  binary-path:
    description: Absolute path to the installed apibconv binary
    value: ${{ steps.install-unix.outputs.binary-path }}
  version:
    description: Installed apibconv version
    value: ${{ steps.install-unix.outputs.version }}
  signature-verified:
    description: Whether the checksum signature bundle was present and verified
    value: ${{ steps.install-unix.outputs.signature-verified }}

runs:
  using: composite
  steps:
    - name: Reject unsupported Windows runners
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Write-Error 'Native Windows is unsupported. Use a Linux runner or run apibconv in WSL.'
        exit 1

    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Install apibconv release on Unix
      id: install-unix
      if: ${{ runner.os != 'Windows' }}
      shell: sh
      env:
        APIBCONV_VERSION: ${{ inputs.version }}
        APIBCONV_ASSET_BASE_URL: ${{ inputs.asset-base-url }}
      run: |
        sh "$GITHUB_ACTION_PATH/scripts/install-apibconv-release.sh"

branding:
  icon: package
  color: blue

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.11.4
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
          verify: false

      - name: Verify lint configuration
        run: |
          # Avoid the verifier's two-second HTTP timeout while retaining schema validation.
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/golangci-lint.schema.json" \
            "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/jsonschema/golangci.jsonschema.json"
          golangci-lint config verify --schema "$RUNNER_TEMP/golangci-lint.schema.json"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  test:
    # Keep these names aligned with the required checks in the main ruleset.
    name: Test (${{ matrix.go-version }}, ${{ matrix.extended_checks }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - go-version: "1.26"
            extended_checks: true
          - go-version: "1.27"
            extended_checks: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run race tests with coverage
        run: |
          mapfile -t packages < <(go list ./... | grep -v /examples/)
          go test -v -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... "${packages[@]}"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run Gosec Security Scanner
        uses: securego/gosec@4504603eddc5a91a7b7713932d6d1d3792126103 # v2.30.0 container fix
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
        continue-on-error: true
        if: always()

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Build
        run: go build -v -ldflags="-X main.version=0.0.0-ci" -o apibconv ./cmd/apibconv

      - name: Test binary
        run: |
          for flag in -v --version; do
            actual_version=$(./apibconv "$flag")
            test "$actual_version" = "apibconv v0.0.0-ci"
          done

      - name: Build Docker image
        run: docker build --build-arg VERSION=0.0.0-ci --tag apibconv:ci .

      - name: Test Docker image
        run: |
          for flag in -v --version; do
            actual_version=$(docker run --rm apibconv:ci "$flag")
            test "$actual_version" = "apibconv v0.0.0-ci"
          done
          docker run --rm apibconv:ci --help
          docker run --rm -i apibconv:ci --from apiblueprint --to openapi --encoding json \
            < test/integration/testdata/apiblueprint.apib > "$RUNNER_TEMP/docker-openapi.json"
          jq -e '.openapi == "3.0.0" and (.paths | length > 0)' "$RUNNER_TEMP/docker-openapi.json"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apibconv-linux-amd64
          path: apibconv

  action:
    name: Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve latest published release
        id: latest-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "No published releases found" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install apibconv via local action
        uses: ./
        with:
          version: ${{ steps.latest-release.outputs.version }}

      - name: Test installed binary
        run: apibconv -v

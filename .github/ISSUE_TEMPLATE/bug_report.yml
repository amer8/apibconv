name: Bug report
description: Report a problem with apibconv.
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately through [GitHub Security Advisories](https://github.com/amer8/apibconv/security/advisories/new).

  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: Describe the problem you observed.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Include the exact command, workflow step, or Go code that triggers the problem.
        For conversion bugs, include a minimal sanitized input spec and the source and target formats and versions.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: apibconv version
      description: Paste the output of `apibconv --version` or provide the release tag, Go module version, or commit SHA.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your OS, CPU architecture, and how you ran apibconv (CLI, Docker, GitHub Actions, or Go library).
      placeholder: Ubuntu 24.04, arm64, Docker
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste any relevant errors, warnings, or excerpts from the generated output.
      render: text
